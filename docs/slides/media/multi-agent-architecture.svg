<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1728 740" role="img" aria-labelledby="title desc">
<title id="title">Cross-agent RECALL: matching peer KV is injected into both DiTs</title>
<desc id="desc">Two camera visits start at the same origin and conditioning image. Each agent writes clean canonical KV tagged with its camera pose to a common archive. When the other agent later looks there, pose-matched peer KV is rephased and spliced into all forty layers of self-attention. The live caches remain private.</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"DejaVu Sans",sans-serif}</style>
<defs><marker id="g" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#3ddc97"/></marker><marker id="w" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#9aa4b2"/></marker></defs>
<text x="864" y="45" text-anchor="middle" font-size="31" fill="#e8ecf2">Same starting image · common origin · two camera paths</text>
<g fill="none" stroke="#9aa4b2" stroke-width="3" marker-end="url(#w)"><path d="M864,63 V90 H410 V122"/><path d="M864,90 H1318 V122"/></g>
<rect x="10" y="130" width="800" height="240" rx="14" fill="#151a22" stroke="#7aa2f7" stroke-width="3"/>
<text x="35" y="177" font-size="32" font-weight="700" fill="#7aa2f7">Agent A · causal video DiT · 40 layers</text>
<text x="35" y="222" font-size="28" fill="#e8ecf2">self-attention window:</text>
<rect x="35" y="250" width="160" height="58" rx="8" fill="#232b38"/><text x="115" y="289" text-anchor="middle" font-size="27" fill="#e8ecf2">first 6</text>
<rect x="211" y="250" width="300" height="58" rx="8" fill="#12382a" stroke="#3ddc97" stroke-width="3"/><text x="361" y="289" text-anchor="middle" font-size="27" font-weight="700" fill="#3ddc97">peer KV from B</text>
<rect x="527" y="250" width="257" height="58" rx="8" fill="#232b38"/><text x="655" y="289" text-anchor="middle" font-size="26" fill="#e8ecf2">recent 12 − K</text>
<text x="580" y="347" text-anchor="middle" font-size="25" fill="#ffca65">→ next POV A chunk</text>
<rect x="918" y="130" width="800" height="240" rx="14" fill="#151a22" stroke="#7aa2f7" stroke-width="3"/>
<text x="943" y="177" font-size="32" font-weight="700" fill="#7aa2f7">Agent B · causal video DiT · 40 layers</text>
<text x="943" y="222" font-size="28" fill="#e8ecf2">self-attention window:</text>
<rect x="943" y="250" width="160" height="58" rx="8" fill="#232b38"/><text x="1023" y="289" text-anchor="middle" font-size="27" fill="#e8ecf2">first 6</text>
<rect x="1119" y="250" width="300" height="58" rx="8" fill="#12382a" stroke="#3ddc97" stroke-width="3"/><text x="1269" y="289" text-anchor="middle" font-size="27" font-weight="700" fill="#3ddc97">peer KV from A</text>
<rect x="1435" y="250" width="257" height="58" rx="8" fill="#232b38"/><text x="1563" y="289" text-anchor="middle" font-size="26" fill="#e8ecf2">recent 12 − K</text>
<text x="1480" y="347" text-anchor="middle" font-size="25" fill="#c5a3ff">→ next POV B chunk</text>
<g fill="none" stroke="#3ddc97" stroke-width="4" marker-end="url(#g)"><path d="M600,490 V423 H361 V313"/><path d="M1128,490 V423 H1269 V313"/></g>
<text x="864" y="406" text-anchor="middle" font-size="30" font-weight="700" fill="#3ddc97">Retrieve the other agent’s matching view</text>
<rect x="314" y="495" width="1100" height="145" rx="14" fill="#12382a" stroke="#3ddc97" stroke-width="3"/>
<text x="864" y="539" text-anchor="middle" font-size="34" font-weight="700" fill="#3ddc97">Shared pose-indexed visual archive</text>
<text x="864" y="578" text-anchor="middle" font-size="27" fill="#e8ecf2">clean frame KV + agent ID + camera pose</text>
<text x="864" y="619" text-anchor="middle" font-size="26" fill="#e8ecf2">A’s left-hand view (−60°)     ·     B’s right-hand view (+60°)</text>
<g fill="none" stroke="#9aa4b2" stroke-width="3" marker-end="url(#w)"><path d="M40,373 V681 H600 V645"/><path d="M1688,373 V681 H1128 V645"/></g>
<text x="72" y="660" font-size="26" fill="#9aa4b2">archive clean KV</text><text x="1435" y="660" font-size="26" fill="#9aa4b2">archive clean KV</text>
<text x="864" y="733" text-anchor="middle" font-size="25" fill="#9aa4b2">Same frozen weights · private live caches · shared archived visual KV · K ≤ 4</text>
</svg>
